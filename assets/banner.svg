<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cartao" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#172036"/>
    </linearGradient>
    <pattern id="grade" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#fundo)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grade)"/>

  <!-- Título -->
  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">
    <text x="80" y="150" fill="#f8fafc" font-size="68" font-weight="800" letter-spacing="-1.5">Caça-Alucinações</text>
    <text x="82" y="200" fill="#cbd5e1" font-size="28" font-weight="500">Verificador determinístico de citações jurídicas</text>
    <text x="82" y="240" fill="#94a3b8" font-size="21">real · inventada · incompleta — contra a base canônica do desafio</text>

    <!-- Pílulas de resultado -->
    <g transform="translate(82,280)">
      <rect width="252" height="50" rx="25" fill="#14532d" stroke="#22c55e" stroke-opacity="0.55"/>
      <text x="126" y="32" fill="#dcfce7" font-size="19" font-weight="700" text-anchor="middle">score 1,1000 (teto)</text>
    </g>
    <g transform="translate(348,280)">
      <rect width="238" height="50" rx="25" fill="#1e293b" stroke="#64748b" stroke-opacity="0.6"/>
      <text x="119" y="32" fill="#e2e8f0" font-size="19" font-weight="600" text-anchor="middle">sem GPU · sem rede</text>
    </g>
    <g transform="translate(600,280)">
      <rect width="168" height="50" rx="25" fill="#1e293b" stroke="#64748b" stroke-opacity="0.6"/>
      <text x="84" y="32" fill="#e2e8f0" font-size="19" font-weight="600" text-anchor="middle">BRACIS 2026</text>
    </g>
  </g>

  <!-- Cartões de citação: as três classes do desafio -->
  <g font-family="'JetBrains Mono', Consolas, 'DejaVu Sans Mono', monospace">
    <g transform="translate(836,52) rotate(-3)">
      <rect width="360" height="72" rx="14" fill="url(#cartao)" stroke="#22c55e" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="40" cy="36" r="20" fill="#16a34a"/>
      <path d="M30 36 l7 7 l14 -15" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="76" y="31" fill="#e2e8f0" font-size="17">REsp nº 1.741.784/PR</text>
      <text x="76" y="54" fill="#86efac" font-size="14">real · id 2566535283</text>
    </g>
    <g transform="translate(866,160) rotate(2)">
      <rect width="360" height="72" rx="14" fill="url(#cartao)" stroke="#ef4444" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="40" cy="36" r="20" fill="#dc2626"/>
      <path d="M32 28 l16 16 M48 28 l-16 16" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
      <text x="76" y="31" fill="#e2e8f0" font-size="17">AREsp nº 9.030.117/SP</text>
      <text x="76" y="54" fill="#fca5a5" font-size="14">inventada · sem registro</text>
    </g>
    <g transform="translate(842,268) rotate(-2)">
      <rect width="360" height="72" rx="14" fill="url(#cartao)" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="40" cy="36" r="20" fill="#d97706"/>
      <text x="40" y="45" fill="#ffffff" font-size="26" font-weight="700" text-anchor="middle" font-family="Inter, Arial, 'DejaVu Sans', sans-serif">?</text>
      <text x="76" y="31" fill="#e2e8f0" font-size="17">julgado do STF de 2024</text>
      <text x="76" y="54" fill="#fcd34d" font-size="14">incompleta · sem id único</text>
    </g>
  </g>
</svg>
